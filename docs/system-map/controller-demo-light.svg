<title id="t">node examples/demo.js: request to five checks</title><desc id="d">A handoff request comes from the --input file or the built-in default. An unreadable or invalid request exits 2 with one line. The controller and protocol run the whole handoff, and the demo prints five checks or the trace.</desc>
