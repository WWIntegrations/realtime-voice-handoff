<g data-id="snapshot" data-typ="klient"><rect class="wz" x="40" y="116" width="168" height="72" rx="8"/>
<text class="n" x="124" y="144" text-anchor="middle">Snapshot</text>
<text class="p" x="124" y="178" text-anchor="middle">Frozen conversation state</text></g>
<g data-id="channel" data-typ="usluga"><rect class="wz" x="288" y="116" width="168" height="72" rx="8"/>
<text class="n" x="372" y="144" text-anchor="middle">DataChannel</text>
<text class="p" x="372" y="178" text-anchor="middle">Actual send and receive</text></g>
<g data-id="ack" data-typ="bramka"><rect class="wz bram" x="536" y="116" width="168" height="72" rx="8"/>
<text class="n" x="620" y="144" text-anchor="middle">ACK check</text>
<text class="p" x="620" y="178" text-anchor="middle">Epoch, digest, deadline</text></g>
<g data-id="audio" data-typ="usluga"><rect class="wz" x="784" y="116" width="168" height="72" rx="8"/>
<text class="n" x="868" y="144" text-anchor="middle">New audio</text>
<text class="p" x="868" y="178" text-anchor="middle">Separate specialist track</text></g>
